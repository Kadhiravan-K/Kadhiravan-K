<svg width="1200" height="430" viewBox="0 0 1200 430"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06100d"/>
      <stop offset="100%" stop-color="#020605"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid"
             width="30"
             height="30"
             patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30"
            fill="none"
            stroke="#12452f"
            stroke-width="0.7"
            opacity="0.4"/>
    </pattern>

  </defs>


  <!-- BACKGROUND -->

  <rect x="10" y="10"
        width="1180"
        height="410"
        rx="18"
        fill="url(#bg)"
        stroke="#176044"
        stroke-width="2"/>

  <rect x="25" y="25"
        width="1150"
        height="380"
        rx="12"
        fill="url(#grid)"/>


  <!-- TITLE -->

  <text x="600" y="55"
        text-anchor="middle"
        fill="#00ff9d"
        font-family="monospace"
        font-size="20"
        font-weight="bold">
    KADHIRAVAN EMBEDDED AND IOT ENGINEER
  </text>


  <!-- ===================================== -->
  <!-- SENSOR NODE -->
  <!-- ===================================== -->

  <g transform="translate(70 130)">

    <rect width="190"
          height="150"
          rx="12"
          fill="#081510"
          stroke="#00ff9d"
          stroke-width="2"
          filter="url(#glow)"/>

    <text x="95" y="35"
          text-anchor="middle"
          fill="#ffffff"
          font-family="monospace"
          font-size="18"
          font-weight="bold">
      SENSORS
    </text>

    <text x="95" y="62"
          text-anchor="middle"
          fill="#71a995"
          font-family="monospace"
          font-size="11">
      TEMPERATURE
    </text>

    <text x="95" y="82"
          text-anchor="middle"
          fill="#71a995"
          font-family="monospace"
          font-size="11">
      VIBRATION
    </text>

    <text x="95" y="102"
          text-anchor="middle"
          fill="#71a995"
          font-family="monospace"
          font-size="11">
      CURRENT
    </text>

    <text x="95" y="122"
          text-anchor="middle"
          fill="#71a995"
          font-family="monospace"
          font-size="11">
      PRESSURE
    </text>

    <circle cx="165" cy="122"
            r="7"
            fill="#00ff9d"
            filter="url(#glow)">

      <animate attributeName="opacity"
               values="1;0.2;1"
               dur="0.8s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ===================================== -->
  <!-- MCU -->
  <!-- ===================================== -->

  <g transform="translate(350 115)">

    <rect width="200"
          height="180"
          rx="10"
          fill="#091513"
          stroke="#00ffff"
          stroke-width="3"
          filter="url(#glow)"/>

    <!-- pins -->

    <g stroke="#00ffff"
       stroke-width="3">

      <line x1="-25" y1="35" x2="0" y2="35"/>
      <line x1="-25" y1="65" x2="0" y2="65"/>
      <line x1="-25" y1="95" x2="0" y2="95"/>
      <line x1="-25" y1="125" x2="0" y2="125"/>

      <line x1="200" y1="45" x2="225" y2="45"/>
      <line x1="200" y1="90" x2="225" y2="90"/>
      <line x1="200" y1="135" x2="225" y2="135"/>

    </g>

    <text x="100" y="60"
          text-anchor="middle"
          fill="#00ffff"
          font-family="monospace"
          font-size="23"
          font-weight="bold">
      MICROCONTROLLER
    </text>

    <text x="100" y="85"
          text-anchor="middle"
          fill="#ffffff"
          font-family="monospace"
          font-size="12">
       ESP32/STM32/Raspberry Pi
    </text>

    <text x="100" y="115"
          text-anchor="middle"
          fill="#5e8177"
          font-family="monospace"
          font-size="10">
      ADC / GPIO / I2C
    </text>

    <text x="100" y="135"
          text-anchor="middle"
          fill="#5e8177"
          font-family="monospace"
          font-size="10">
      UART / SPI
    </text>

    <circle cx="25" cy="155"
            r="5"
            fill="#00ffff">

      <animate attributeName="opacity"
               values="1;0.1;1"
               dur="0.6s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ===================================== -->
  <!-- CLOUD -->
  <!-- ===================================== -->

  <g transform="translate(650 130)">

    <path d="
      M45 120
      C15 120 5 95 20 75
      C10 45 35 20 65 25
      C85 -5 130 5 140 35
      C175 30 195 55 185 85
      C205 105 190 125 165 125
      Z"
      fill="#081513"
      stroke="#00ff9d"
      stroke-width="3"
      filter="url(#glow)"/>

    <text x="105" y="70"
          text-anchor="middle"
          fill="#00ff9d"
          font-family="monospace"
          font-size="25"
          font-weight="bold">
      CLOUD
    </text>

    <text x="105" y="94"
          text-anchor="middle"
          fill="#6b9689"
          font-family="monospace"
          font-size="10">
      MQTT BROKER
    </text>

    <text x="105" y="110"
          text-anchor="middle"
          fill="#6b9689"
          font-family="monospace"
          font-size="10">
      DATA / API
    </text>

  </g>


  <!-- ===================================== -->
  <!-- DASHBOARD -->
  <!-- ===================================== -->

  <g transform="translate(930 125)">

    <rect width="190"
          height="175"
          rx="10"
          fill="#091513"
          stroke="#00ffff"
          stroke-width="2"
          filter="url(#glow)"/>

    <text x="95" y="32"
          text-anchor="middle"
          fill="#ffffff"
          font-family="monospace"
          font-size="17"
          font-weight="bold">
      DASHBOARD
    </text>

    <!-- mini graph -->

    <rect x="20" y="50"
          width="150"
          height="65"
          fill="#040908"
          stroke="#174c3d"/>

    <polyline points="
      25,100
      45,90
      60,98
      75,70
      90,82
      105,60
      120,75
      135,55
      150,68
      165,48"
      fill="none"
      stroke="#00ff9d"
      stroke-width="2"/>

    <text x="25" y="140"
          fill="#6b9689"
          font-family="monospace"
          font-size="9">
      TEMP: 35°C
    </text>

    <text x="25" y="157"
          fill="#6b9689"
          font-family="monospace"
          font-size="9">
      STATUS: ONLINE
    </text>

  </g>


  <!-- ===================================== -->
  <!-- CONNECTIONS -->
  <!-- ===================================== -->

  <g fill="none"
     stroke="#16795c"
     stroke-width="3">

    <path id="line1"
          d="M260 205 H350"/>

    <path id="line2"
          d="M550 205 H680"/>

    <path id="line3"
          d="M835 205 H930"/>

  </g>


  <!-- connection labels -->

  <g font-family="monospace"
     font-size="10"
     fill="#5f9885">

    <text x="305" y="193"
          text-anchor="middle">
      I2C / ADC
    </text>

    <text x="615" y="193"
          text-anchor="middle">
      WiFi
    </text>

    <text x="880" y="193"
          text-anchor="middle">
      MQTT
    </text>

  </g>


  <!-- ===================================== -->
  <!-- MOVING DATA PACKETS -->
  <!-- ===================================== -->

  <g fill="#ffffff"
     filter="url(#glow)">

    <circle r="5">

      <animateMotion dur="1.5s"
                     repeatCount="indefinite">

        <mpath href="#line1"/>

      </animateMotion>

    </circle>


    <circle r="5">

      <animateMotion dur="1.8s"
                     begin="0.5s"
                     repeatCount="indefinite">

        <mpath href="#line2"/>

      </animateMotion>

    </circle>


    <circle r="5">

      <animateMotion dur="1.4s"
                     begin="0.8s"
                     repeatCount="indefinite">

        <mpath href="#line3"/>

      </animateMotion>

    </circle>

  </g>


  <!-- ===================================== -->
  <!-- BOTTOM -->
  <!-- ===================================== -->

  <text x="600" y="350"
        text-anchor="middle"
        fill="#718c83"
        font-family="monospace"
        font-size="11">

    SENSOR DATA → PROCESSING → COMMUNICATION → VISUALIZATION

  </text>

  <circle cx="500" cy="375"
          r="5"
          fill="#00ff9d">

    <animate attributeName="opacity"
             values="1;0.2;1"
             dur="1s"
             repeatCount="indefinite"/>

  </circle>

  <text x="515" y="379"
        fill="#00ff9d"
        font-family="monospace"
        font-size="11">
    REAL-TIME DATA FLOW ACTIVE
  </text>

</svg>