<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%" style="background-color: #050b08;">
  <defs>
    <!-- Glow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040f09" />
      <stop offset="100%" stop-color="#010503" />
    </linearGradient>

    <!-- Animation Keyframes -->
    <style>
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -20; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .pulsing-box {
        animation: pulse 3s infinite ease-in-out;
        transform-origin: center;
      }
      .data-line {
        stroke-dasharray: 6, 6;
        animation: dash 1s linear infinite;
      }
      .blinking-dot {
        animation: blink 1.5s infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg-grad)" />

  <!-- Background Circuit Grid Lines / Traces -->
  <g stroke="#0e3822" stroke-width="1.5" fill="none">
    <path d="M 0,80 H 1200 M 0,420 H 1200 M 150,0 V 500 M 1050,0 V 500" opacity="0.3"/>
    <!-- Complex Circuit Paths -->
    <path d="M 50,0 V 60 H 120 V 100" />
    <path d="M 1150,500 V 440 H 1080 V 400" />
    <path d="M 200,500 V 460 H 350 V 420 H 450" />
    <path d="M 900,0 V 50 H 850 V 90 H 750" />
    <path d="M 30,200 H 80 V 150 H 140" />
    <path d="M 1170,300 H 1120 V 350 H 1060" />
    <!-- Small Nodes -->
    <circle cx="120" cy="60" r="3" fill="#00ff9d" opacity="0.6"/>
    <circle cx="1080" cy="440" r="3" fill="#00ff9d" opacity="0.6"/>
    <circle cx="350" cy="460" r="3" fill="#00ff9d" opacity="0.6"/>
    <circle cx="850" cy="50" r="3" fill="#00ff9d" opacity="0.6"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="45" font-family="monospace" font-size="18" font-weight="bold" fill="#00ff9d" text-anchor="middle" letter-spacing="3" filter="url(#neon-glow)">
    KADHIRAVAN EMBEDDED AND IOT ENGINEER
  </text>

  <!-- Workflow Labels Bottom -->
  <g font-family="monospace" font-size="11" fill="#00ff9d" opacity="0.7" text-anchor="middle">
    <text x="315" y="435">SENSOR DATA</text>
    <text x="390" y="435">→</text>
    <text x="475" y="435">PROCESSING</text>
    <text x="560" y="435">→</text>
    <text x="660" y="435">COMMUNICATION</text>
    <text x="760" y="435">→</text>
    <text x="850" y="435">VISUALIZATION</text>
  </g>
  
  <g font-family="monospace" font-size="11" fill="#00ff9d" text-anchor="middle">
    <circle cx="430" cy="455" r="4" fill="#00ff9d" class="blinking-dot" />
    <text x="535" y="459">REAL-TIME DATA FLOW ACTIVE</text>
  </g>

  <!-- ==================== SENSORS BLOCK ==================== -->
  <g transform="translate(80, 130)">
    <!-- Side Input Icons (Temp, Wave, Current, Timer) -->
    <g transform="translate(-45, 0)" stroke="#00ff9d" stroke-width="1.5" fill="none">
      <!-- Temp Icon -->
      <rect x="0" y="10" width="16" height="30" rx="8" />
      <circle cx="8" cy="33" r="4" fill="#00ff9d"/>
      <!-- Wave Icon -->
      <path d="M 0,75 L 4,70 L 8,80 L 12,70 L 16,75" />
      <!-- Current Icon -->
      <path d="M 8,110 L 3,123 H 10 L 6,136" />
      <!-- Clock Icon -->
      <circle cx="8" cy="170" r="8" />
      <path d="M 8,165 V 170 H 12" />
    </g>

    <!-- Main Box -->
    <rect x="0" y="0" width="180" height="190" rx="12" fill="#02150b" stroke="#00ff9d" stroke-width="2" filter="url(#neon-glow)" class="pulsing-box" />
    
    <!-- Content -->
    <text x="90" y="38" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">SENSORS</text>
    <line x1="30" y1="52" x2="150" y2="52" stroke="#00ff9d" stroke-width="1" opacity="0.5" />
    
    <text x="90" y="80" font-family="monospace" font-size="13" fill="#00ff9d" text-anchor="middle">TEMPERATURE</text>
    <text x="90" y="110" font-family="monospace" font-size="13" fill="#00ff9d" text-anchor="middle">VIBRATION</text>
    <text x="90" y="140" font-family="monospace" font-size="13" fill="#00ff9d" text-anchor="middle">CURRENT</text>
    <text x="90" y="170" font-family="monospace" font-size="13" fill="#00ff9d" text-anchor="middle">PRESSURE</text>

    <!-- Active Indicator Light -->
    <circle cx="160" cy="172" r="5" fill="#00ff9d" filter="url(#neon-glow)" class="blinking-dot" />
  </g>

  <!-- ==================== MICROCONTROLLER BLOCK ==================== -->
  <g transform="translate(360, 130)">
    <!-- Pin Headers (Left & Right) -->
    <g fill="#00ff9d" opacity="0.8">
      <rect x="-8" y="30" width="8" height="6" />
      <rect x="-8" y="50" width="8" height="6" />
      <rect x="-8" y="70" width="8" height="6" />
      <rect x="-8" y="110" width="8" height="6" />
      <rect x="-8" y="130" width="8" height="6" />
      <rect x="-8" y="150" width="8" height="6" />

      <rect x="180" y="30" width="8" height="6" />
      <rect x="180" y="50" width="8" height="6" />
      <rect x="180" y="70" width="8" height="6" />
      <rect x="180" y="110" width="8" height="6" />
      <rect x="180" y="130" width="8" height="6" />
      <rect x="180" y="150" width="8" height="6" />
    </g>

    <!-- Main Box -->
    <rect x="0" y="0" width="180" height="190" rx="12" fill="#02150b" stroke="#00bfff" stroke-width="2" filter="url(#neon-glow)" />

    <!-- Content -->
    <text x="90" y="32" font-family="monospace" font-size="14" font-weight="bold" fill="#00bfff" text-anchor="middle" letter-spacing="1">MICROCONTROLLER</text>
    <text x="90" y="50" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">ESP32/STM32/Raspberry Pi</text>
    <line x1="20" y1="65" x2="160" y2="65" stroke="#00bfff" stroke-width="1" opacity="0.5" />

    <text x="90" y="105" font-family="monospace" font-size="12" fill="#00ff9d" text-anchor="middle">ADC / GPIO / I2C</text>
    <text x="90" y="135" font-family="monospace" font-size="12" fill="#00ff9d" text-anchor="middle">UART / SPI</text>

    <!-- Status Dot -->
    <circle cx="25" cy="165" r="4" fill="#00ff9d" filter="url(#neon-glow)" class="blinking-dot" />
  </g>

  <!-- ==================== CLOUD BLOCK ==================== -->
  <g transform="translate(640, 140)">
    <!-- Cloud Path -->
    <path d="M 45,90 
             H 135 
             A 35,35 0 0,0 165,65 
             A 25,25 0 0,0 135,25 
             A 45,45 0 0,0 55,20 
             A 35,35 0 0,0 20,60 
             A 30,30 0 0,0 45,90 Z" 
          fill="#02150b" stroke="#00ff9d" stroke-width="2" filter="url(#neon-glow)" />

    <!-- Content -->
    <text x="92" y="50" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">CLOUD</text>
    <text x="92" y="70" font-family="monospace" font-size="11" fill="#00ff9d" text-anchor="middle">MQTT BROKER</text>
    <text x="92" y="86" font-family="monospace" font-size="11" fill="#00ff9d" text-anchor="middle">DATA / API</text>

    <!-- Wi-Fi Icon inside Cloud -->
    <g transform="translate(77, 98)" stroke="#00ff9d" stroke-width="1.5" fill="none">
      <path d="M 0,12 A 15,15 0 0,1 30,12" />
      <path d="M 5,18 A 9,9 0 0,1 25,18" />
      <circle cx="15" cy="22" r="1.5" fill="#00ff9d" />
    </g>
  </g>

  <!-- ==================== DASHBOARD BLOCK ==================== -->
  <g transform="translate(940, 130)">
    <!-- Side Icons (Monitor, Phone, Analytics) -->
    <g transform="translate(60, 0)" stroke="#00ff9d" stroke-width="1.5" fill="none">
      <!-- Monitor -->
      <rect x="0" y="15" width="22" height="15" rx="2" />
      <path d="M 6,33 H 16 M 11,30 V 33" />
      <!-- Phone -->
      <rect x="4" y="65" width="14" height="24" rx="2" />
      <circle cx="11" cy="86" r="1" fill="#00ff9d" />
      <!-- Analytics Icon -->
      <rect x="2" y="115" width="18" height="18" rx="2" />
      <path d="M 6,127 L 9,123 L 13,126 L 16,119" />
    </g>

    <!-- Main Box -->
    <rect x="0" y="0" width="180" height="190" rx="12" fill="#02150b" stroke="#00ff9d" stroke-width="2" filter="url(#neon-glow)" class="pulsing-box" />

    <!-- Content -->
    <text x="90" y="32" font-family="monospace" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">DASHBOARD</text>
    <line x1="20" y1="42" x2="160" y2="42" stroke="#00ff9d" stroke-width="1" opacity="0.5" />

    <!-- Mini Line Chart inside Dashboard -->
    <g transform="translate(15, 52)" stroke="#00ff9d" stroke-width="1.5" fill="none">
      <rect x="0" y="0" width="150" height="60" rx="4" stroke="#0e4a27" fill="#010d06" />
      <path d="M 10,45 Q 35,20 60,35 T 110,15 T 140,30" />
      <circle cx="60" cy="35" r="3" fill="#00ff9d" />
      <circle cx="110" cy="15" r="3" fill="#00ff9d" />
      <circle cx="140" cy="30" r="3" fill="#00ff9d" />
    </g>

    <text x="25" y="134" font-family="monospace" font-size="11" fill="#00ff9d">TEMP: 35°C</text>
    <text x="25" y="152" font-family="monospace" font-size="11" fill="#00ff9d">STATUS: ONLINE</text>

    <!-- Active Indicator Light -->
    <circle cx="155" cy="155" r="5" fill="#00ff9d" filter="url(#neon-glow)" class="blinking-dot" />
  </g>

  <!-- ==================== CONNECTION PATHS & ANIMATED DATA FLOWS ==================== -->
  
  <!-- Path 1: Sensors to Microcontroller -->
  <g>
    <path d="M 260,225 H 360" stroke="#0e4a27" stroke-width="3" fill="none" />
    <path d="M 260,225 H 360" stroke="#00ff9d" stroke-width="2" fill="none" class="data-line" />
    <text x="310" y="215" font-family="monospace" font-size="11" fill="#00ff9d" text-anchor="middle">I2C / ADC</text>
  </g>

  <!-- Path 2: Microcontroller to Cloud -->
  <g>
    <path d="M 540,225 H 640" stroke="#0e4a27" stroke-width="3" fill="none" />
    <path d="M 540,225 H 640" stroke="#00ff9d" stroke-width="2" fill="none" class="data-line" />
    <text x="590" y="215" font-family="monospace" font-size="11" fill="#00ff9d" text-anchor="middle">WiFi</text>
  </g>

  <!-- Path 3: Cloud to Dashboard -->
  <g>
    <path d="M 825,225 H 940" stroke="#0e4a27" stroke-width="3" fill="none" />
    <path d="M 825,225 H 940" stroke="#00ff9d" stroke-width="2" fill="none" class="data-line" />
    <text x="882" y="215" font-family="monospace" font-size="11" fill="#00ff9d" text-anchor="middle">MQTT</text>
  </g>

</svg>
